<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 책열쇠 학습지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  /* 밝은 교실 화면용 단일 테마: 황금 열쇠 + 거북 초록 + 은촛대 파랑 */
  --bg:#EEF3FA; --paper:#FFFFFF; --ink:#1E2B3C; --muted:#5A6A80; --line:#D7E0EC; --line2:#B9C6D8;
  --key:#FFB627; --key-deep:#B87A00; --key-soft:#FFF1C9;
  --turtle:#1F9E66; --turtle-soft:#DCF5E8;
  --hugo:#3F55D1; --hugo-soft:#E3E8FF;
  --pink:#E9466F; --pink-soft:#FFE2EA;
  --ok:#15955B; --bad:#D93D45;
  --display:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  /* 레이아웃: 왼쪽 차시 목록 + 오른쪽 수업 화면, 수업 화면 모드는 전체 덮기 */
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hugo);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.3}
.app{display:grid;grid-template-columns:290px 1fr;grid-template-rows:auto 1fr;height:100%}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:8px 18px;background:var(--paper);border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;background:none;border:0;padding:0}
.brand b{font-family:var(--display);font-size:22px;font-weight:400;white-space:nowrap}
.brand small{color:var(--muted);font-size:13px}
.top .sp{flex:1}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line2);background:var(--paper);border-radius:999px;padding:6px 14px;font-family:var(--display);font-size:15px;box-shadow:0 3px 0 var(--line2)}
.tbtn:hover{transform:translateY(-1px)}
.tbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line2)}
.tbtn.key{background:var(--key);border-color:var(--key-deep);box-shadow:0 3px 0 var(--key-deep)}
.menu{display:none}
.side{overflow:auto;background:var(--paper);border-right:2px solid var(--line);padding:14px 12px 40px}
.side h3{font-size:15px;color:var(--muted);margin:16px 8px 6px;display:flex;align-items:center;gap:6px}
.side h3 i{width:10px;height:10px;border-radius:50%;display:inline-block}
.litem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:7px 8px}
.litem:hover{background:var(--bg)}
.litem.on{background:var(--key-soft)}
.litem .no{flex:none;min-width:44px;text-align:center;font-family:var(--display);font-size:13px;padding:2px 6px;border-radius:8px;background:var(--bg);border:1.5px solid var(--line2)}
.litem.on .no{background:var(--key);border-color:var(--key-deep)}
.litem .tt{font-size:14px;line-height:1.35;flex:1}
.litem .tt small{display:block;color:var(--muted);font-size:12px}
.litem svg{flex:none}
.main{overflow:auto;padding:24px clamp(16px,3vw,40px) 80px}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:22px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:20px 22px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:13px;border:1.5px solid var(--line2);background:var(--paper);white-space:nowrap}
.chip.turtle{background:var(--turtle-soft);border-color:var(--turtle);color:#0E6B43}
.chip.hugo{background:var(--hugo-soft);border-color:var(--hugo);color:#26369A}
.chip.key{background:var(--key-soft);border-color:var(--key-deep);color:#7A5200}
.chip.pink{background:var(--pink-soft);border-color:var(--pink);color:#A21F45}
/* 홈 */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:linear-gradient(135deg,var(--key-soft),#FFFFFF 60%);border-color:#F3D98A}
.hero h1{font-size:clamp(26px,4vw,38px)}
.hero p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.bubble{position:relative;background:var(--paper);border:2px solid var(--ink);border-radius:18px;padding:10px 16px;font-size:17px}
.bubble:before{content:"";position:absolute;left:-12px;top:20px;border:10px solid transparent;border-right-color:var(--ink);border-left:0}
.bubble:after{content:"";position:absolute;left:-8px;top:22px;border:8px solid transparent;border-right-color:var(--paper);border-left:0}
.books{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bookcard{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.bookcard.turtle{background:var(--turtle-soft);border-color:#9AD9B9}
.bookcard.hugo{background:var(--hugo-soft);border-color:#AEB9F2}
.bookcard h2{font-size:24px}
.bookcard .by{font-size:13px;color:var(--muted)}
.bookcard p{margin:8px 0}
.bookcard .ls{display:flex;flex-wrap:wrap;gap:6px}
.bookcard .ls button{border:0;background:var(--paper);border-radius:10px;padding:3px 9px;font-size:13px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-h h2{font-size:22px}
.sec-h .sp{flex:1}
.muted{color:var(--muted)}
/* 여정 지도 */
.journey{display:grid;gap:14px}
.jrow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center}
.jrow .lab{font-family:var(--display);font-size:17px;padding:6px 10px;border-radius:12px;text-align:center}
.jstones{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stone{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:92px;min-height:76px;border-radius:18px;border:2px solid var(--line2);background:var(--paper);padding:6px 4px;font-size:12px;line-height:1.25;text-align:center;box-shadow:0 3px 0 var(--line2)}
.stone b{font-family:var(--display);font-weight:400;font-size:14px}
.stone.turtle{border-color:var(--turtle);box-shadow:0 3px 0 var(--turtle)}
.stone.hugo{border-color:var(--hugo);box-shadow:0 3px 0 var(--hugo)}
.stone.both{border-color:var(--pink);box-shadow:0 3px 0 var(--pink)}
.stone.seen:after{content:"✓";position:absolute;top:-8px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;font-size:12px;display:grid;place-items:center}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.stds{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.stds li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14px}
/* 차시 */
.lhead{border:0;color:#fff;padding:22px 24px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.lhead.turtle{background:var(--turtle)}.lhead.hugo{background:var(--hugo)}.lhead.none{background:#2F3E57}.lhead.both{background:var(--pink)}
.lhead .crumb{font-size:14px;opacity:.9}
.lhead h1{font-size:clamp(26px,3.6vw,36px);margin:4px 0 8px}
.lhead .meta{display:flex;flex-wrap:wrap;gap:6px}
.lhead .chip{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.55);color:#fff}
.lhead .acts{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.goal{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.goal ul{margin:6px 0 0;padding-left:20px}
.flow{display:grid;gap:14px}
.step{display:grid;grid-template-columns:76px 1fr;gap:14px}
.step .st{display:flex;flex-direction:column;align-items:center;gap:4px}
.st .stage{font-family:var(--display);font-size:15px;border-radius:12px;padding:4px 10px;background:var(--key-soft);border:2px solid var(--key-deep)}
.st .stage.전개{background:var(--hugo-soft);border-color:var(--hugo)}
.st .stage.정리{background:var(--pink-soft);border-color:var(--pink)}
.st .min{font-size:13px;color:var(--muted)}
.st .bar{flex:1;width:3px;background:var(--line);border-radius:2px}
.step .body{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:16px 18px}
.step h3{font-size:20px}
.ask{display:flex;gap:10px;align-items:flex-start;margin:10px 0;padding:10px 14px;border-radius:14px;background:var(--key-soft);font-size:16.5px}
.ask b{font-family:var(--display);font-weight:400;flex:none;background:var(--key);border-radius:8px;padding:0 8px}
.step ul{margin:6px 0;padding-left:20px}
.tip{font-size:14px;color:#5B4A12;background:#FFF8E1;border-left:4px solid var(--key);padding:8px 12px;border-radius:8px;margin-top:8px}
.tool{margin-top:12px;border:2px dashed var(--line2);border-radius:16px;padding:14px;background:#FAFCFF}
.tool > .th{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-family:var(--display);font-size:16px}
.tool > .th .sp{flex:1}
.evalc{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--pink-soft);border-color:#F5B3C4}
.wslist{display:grid;gap:8px;margin:8px 0 0;padding:0;list-style:none}
.wslist li{display:flex;gap:8px;align-items:baseline}
.wslist li span{font-size:12px;border-radius:6px;padding:0 6px;background:var(--bg);border:1px solid var(--line2);flex:none}
.pager{display:flex;justify-content:space-between;gap:10px}
/* 위젯 공통 */
.btn{border:2px solid var(--line2);background:var(--paper);border-radius:12px;padding:5px 12px;font-size:15px;box-shadow:0 2px 0 var(--line2)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.pri{background:var(--key);border-color:var(--key-deep);box-shadow:0 2px 0 var(--key-deep);font-family:var(--display)}
.btn.sm{padding:2px 9px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inp{border:2px solid var(--line2);border-radius:12px;padding:6px 10px;background:#fff;min-width:0}
.cols{display:grid;gap:10px}
.colbox{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;min-height:120px}
.colbox h4{font-size:16px;margin-bottom:8px}
.stickies{display:flex;flex-wrap:wrap;gap:8px}
.sticky{position:relative;background:#FFF3B0;border-radius:4px 14px 4px 14px;padding:10px 26px 10px 12px;min-width:120px;max-width:240px;font-size:15px;box-shadow:0 3px 6px rgba(30,43,60,.12);overflow-wrap:anywhere}
.sticky.c1{background:#D7F3E5}.sticky.c2{background:#DDE4FF}.sticky.c3{background:#FFDDE6}.sticky.c4{background:#E9E0FF}
.sticky .x{position:absolute;top:2px;right:4px;border:0;background:none;font-size:15px;color:var(--muted);padding:2px}
.sticky .lk{display:block;margin-top:6px;border:1.5px solid var(--pink);background:#fff;border-radius:999px;font-size:13px;padding:0 8px;color:var(--pink)}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:8px;border-radius:12px;background:var(--bg)}
.ccard{border:2px solid var(--line2);background:#fff;border-radius:12px;padding:6px 12px;font-size:15px;text-align:left}
.ccard.sel{border-color:var(--hugo);background:var(--hugo-soft);box-shadow:0 0 0 3px rgba(63,85,209,.2)}
.ccard.ok{border-color:var(--ok);background:#E3F7EC}.ccard.no{border-color:var(--bad);background:#FDE7E8}
.bin{border:2px dashed var(--line2);border-radius:14px;padding:10px;min-height:110px;background:#fff;text-align:left;width:100%}
.bin h4{font-size:17px;margin-bottom:8px}
.bin.hot{border-color:var(--hugo);background:var(--hugo-soft)}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.flip{perspective:800px;border:0;background:none;padding:0;min-height:130px;text-align:center}
.flip .in{position:relative;width:100%;height:100%;min-height:130px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;padding:12px;border:2px solid var(--line2)}
.flip .f{background:linear-gradient(160deg,var(--key-soft),#fff);font-family:var(--display);font-size:20px}
.flip .f.big{font-size:28px;letter-spacing:.06em}
.flip .b{background:#fff;transform:rotateY(180deg);font-size:15px;line-height:1.5;overflow:auto}
.poll{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 46px auto;gap:8px;align-items:center}
.prow .lbl{position:relative;border-radius:10px;background:var(--bg);padding:6px 10px;overflow:hidden;font-size:15px}
.prow .lbl i{position:absolute;inset:0 auto 0 0;background:var(--key);opacity:.45;border-radius:10px;transition:width .3s}
.prow .lbl span{position:relative}
.prow.top .lbl i{background:var(--pink);opacity:.4}
.prow .n{font-family:var(--display);font-size:20px;text-align:center;font-variant-numeric:tabular-nums}
.reels{display:grid;gap:10px}
.reel{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center}
.reel .nm{font-family:var(--display);font-size:15px;color:var(--muted)}
.reel .v{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 14px;font-size:18px;font-family:var(--display);min-height:52px;display:flex;align-items:center}
.reel .v.spin{animation:jit .1s linear infinite}
@keyframes jit{50%{transform:translateY(-2px)}}
.lock{border:2px solid var(--line2);background:#fff;border-radius:10px;padding:4px 8px}
.lock.on{background:var(--key);border-color:var(--key-deep)}
.whatq{margin-top:10px;font-size:20px;font-family:var(--display);background:var(--hugo-soft);border-radius:14px;padding:12px 16px}
.saved{margin:8px 0 0;padding-left:20px}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:10px}
.slot{border:2px dashed var(--line2);border-radius:14px;background:#fff;padding:10px;text-align:center}
.slot.on{border-color:var(--hugo);background:var(--hugo-soft)}
.slot small{display:block;color:var(--muted)}
.slot b{font-family:var(--display);font-weight:400;font-size:20px;display:block;min-height:30px}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchip{border:2px solid var(--key-deep);background:var(--key-soft);border-radius:999px;padding:3px 12px;font-family:var(--display)}
.mood svg{width:100%;height:auto;display:block}
.mood .scn{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-size:13px;text-align:center;color:var(--muted);line-height:1.35}
.rel{position:relative;width:100%;aspect-ratio:16/10;background:radial-gradient(circle at 50% 50%,#fff,#F1F4FF);border-radius:16px;border:2px solid var(--line)}
.rel > svg{position:absolute;inset:0;width:100%;height:100%}
.rnode{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0;font-family:var(--display);font-size:14px}
.rnode .fc{background:#fff;border:2.5px solid var(--line2);border-radius:50%;padding:2px;line-height:0}
.rnode.on .fc{border-color:var(--key-deep);box-shadow:0 0 0 4px var(--key)}
.rnode span{background:#fff;border-radius:8px;padding:0 6px;margin-top:2px}
.rbadge{position:absolute;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:50%;width:30px;height:30px;font-size:14px;display:grid;place-items:center;padding:0;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.rbadge.help{background:#CFE0FF}.rbadge.love{background:#FFD3DF}.rbadge.conflict{background:#FFD0D2}
.rbadge.on{box-shadow:0 0 0 4px var(--key)}
.rbadge.dim{opacity:.25}
.rinfo{margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;min-height:70px}
.hs-tabs{display:flex;flex-wrap:wrap;gap:6px}
.hs-tab{display:flex;align-items:center;gap:4px;border:2px solid var(--line2);background:#fff;border-radius:14px;padding:2px 10px 2px 2px;font-family:var(--display)}
.hs-tab.on{border-color:var(--hugo);background:var(--hugo-soft)}
.hs-stage{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:12px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px}
.hs-q{font-family:var(--display);font-size:22px}
.hs-ql{display:grid;gap:6px;margin-top:10px}
.hs-ql button{text-align:left;border:1.5px solid var(--line2);background:#fff;border-radius:10px;padding:5px 10px}
.stbl{width:100%;border-collapse:separate;border-spacing:0 6px}
.stbl input{width:100%}
.stbl th{font-size:13px;color:var(--muted);text-align:left;font-weight:400}
.pads{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.pad{border:2px solid var(--line2);background:#fff;border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 var(--line2);font-size:14px}
.pad i{font-style:normal;font-size:26px}
.pad.play{background:var(--key-soft);border-color:var(--key-deep)}
.stars{display:grid;gap:6px}
.srow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:4px 10px;border:1.5px solid var(--line)}
.srow .ss{display:flex}
.srow .ss button{border:0;background:none;font-size:24px;padding:0 2px;color:#D4DCE7;line-height:1}
.srow .ss button.on{color:var(--key)}
.rolesout{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.rcard{background:#fff;border:2px solid var(--line2);border-radius:14px;padding:8px 10px;text-align:center}
.rcard small{display:block;color:var(--muted)}
.rcard b{font-family:var(--display);font-weight:400;font-size:19px}
.parts{display:grid;gap:8px}
.part{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.part.done{border-color:var(--hugo);background:var(--hugo-soft)}
.part .cd{width:34px;height:44px;display:grid;place-items:center}
.cloud{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;min-height:120px;background:#fff;border-radius:14px;border:2px solid var(--line);padding:14px}
.cloud span{font-family:var(--display);line-height:1.1}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:6px 12px}
.checks input{width:20px;height:20px;accent-color:var(--turtle)}
.poster-w{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,320px);gap:16px}
.poster{aspect-ratio:3/4;border-radius:16px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;border:3px solid var(--ink);overflow:hidden}
.poster .pt{font-family:var(--display);font-size:clamp(20px,2.4vw,30px);line-height:1.25;overflow-wrap:anywhere}
.poster .ps{font-size:15px;overflow-wrap:anywhere}
.poster .pb{font-family:var(--display);font-size:14px;border-radius:999px;padding:2px 12px;background:rgba(255,255,255,.7)}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line2)}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.acro{display:grid;gap:6px}
.acro .ar{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center}
.acro .ar b{font-family:var(--display);font-weight:400;font-size:26px;background:var(--key);border-radius:12px;text-align:center}
.scale{display:grid;gap:6px}
.scrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:6px 10px}
.scrow .dots{display:flex;gap:14px}
.scrow .dg{display:flex;flex-direction:column;align-items:center;gap:2px}
.scrow .dg small{font-size:11px;color:var(--muted)}
.scrow .dd{display:flex;gap:3px}
